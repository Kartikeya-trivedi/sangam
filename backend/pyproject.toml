[project]
name = "setu-backend"
version = "0.1.0"
description = "SETU — Missing-Persons Reunification backend (Kumbh Mela 2027). SQLite-backed."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "numpy",
    "rapidfuzz",          # fuzzy + phonetic name matching (matching engine)
    "anthropic",          # Claude — reasoning core (extraction / rerank / announce)
]

[project.optional-dependencies]
# Speech (Sarvam Saaras STT + Bulbul TTS). The app boots and matches without it (services/speech.py degrades).
speech = ["sarvamai"]
# Face matching needs a GPU/onnx box and is a LIVE-INTAKE feature (the dataset has no photos).
# CPU box: swap onnxruntime-gpu -> onnxruntime. faces.py degrades to None when absent.
faces = ["insightface", "onnxruntime"]

[dependency-groups]
dev = ["ruff", "pytest", "httpx"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
