# SETU backend on Fly.io. Deploy: `fly launch --no-deploy` (first time) then `fly deploy`.
# Set secrets (NOT committed):  fly secrets set ANTHROPIC_API_KEY=... SARVAM_API_KEY=... SUPABASE_URL=... SUPABASE_KEY=...
app = "setu-kumbh"
primary_region = "bom"   # Mumbai — closest to Nashik

[build]
  dockerfile = "Dockerfile"

[env]
  OFFLINE_MODE = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
