# SETU — backend + both frontends (spec §17: `docker compose up`).
# Backend is the deployable artifact; the two frontends run as Vite dev servers here.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    # Edge/offline mode at a camp: set OFFLINE_MODE=true in .env (spec §13).

  pilgrim:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend/pilgrim:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000

  ops:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ./frontend/ops:/app
    ports:
      - "5174:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000
